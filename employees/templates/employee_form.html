{% extends 'base.html' %}

{% block content %}

<div class="container">

<h2 class="mb-4">Add Employee</h2>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn btn-success">
        Save Employee
    </button>

    <a href="/employees/" class="btn btn-secondary">
        Cancel
    </a>

</form>

</div>

{% endblock %}
